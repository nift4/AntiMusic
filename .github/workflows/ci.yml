name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build AntiMusic.app
        run: bash tests/build_app.sh

      - name: State machine unit tests
        run: |
          TDIR=$(mktemp -d)
          cp AntiMusic/WakeStateMachine.swift "$TDIR/"
          cp tests/StateMachineTests.swift "$TDIR/main.swift"
          swiftc "$TDIR/WakeStateMachine.swift" "$TDIR/main.swift" -o "$TDIR/smt"
          "$TDIR/smt"

      - name: Compile POC suite (sanity)
        run: |
          mkdir -p /tmp/pocbin
          for f in poc/*.swift; do
            name=$(basename "$f" .swift)
            swiftc -o "/tmp/pocbin/$name" "$f" 2>/dev/null && echo "OK $name" || echo "SKIP $name (needs APIs unavailable on runner)"
          done

      # 注入/媒体键类 POC 需要 TCC 授权，CI 上必然 SKIPPED——这是门控的预期行为，
      # 在带 GUI 的 macOS 测试机上以 `tests/run_all.sh` 运行全量闭环。
      - name: POC suite (TCC-gated)
        run: |
          mkdir -p /tmp/antimusic-testbin
          BIN=/tmp/antimusic-testbin bash tests/run_poc_suite.sh || true

      - uses: actions/upload-artifact@v4
        with:
          name: AntiMusic-app
          path: build/AntiMusic.app
